server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Main location - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JavaScript files - no cache for main entry, cache for chunks
    location ~* ^/js/.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # CSS files
    location ~* ^/css/.*\.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # Other static assets
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html - no cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 预渲染的子路由 HTML 也不缓存（/about/index.html、/register/index.html 等）
    # SEO 场景下 HTML 更新需即时生效，爬虫命中后应实时读取最新内容
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SEO 相关静态文件：短缓存，便于搜索引擎频繁抓取
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}